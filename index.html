              { de: "Er kann kein Wasser kochen, geschweige denn ein Drei-Gänge-Menü zubereiten.", bn: "সে পানিই ফোটাতে পারে না, একটি থ্রি-কোর্স মিল রান্না করা তো দূরের কথা।" },
              { de: "Sie hat kein Geld für Brot, geschweige denn für ein neues Auto.", bn: "তার রুটি কেনার টাকাই নেই, একটি নতুন গাড়ি কেনা তো দূরের কথা।" },
              { de: "Ich habe keine Zeit für ein Hobby, geschweige denn für einen Urlaub.", bn: "আমার একটা শখের জন্যই সময় নেই, ছুটিতে যাওয়া তো দূরের কথা।" },
              { de: "Er versteht die Grundlagen nicht, geschweige denn die fortgeschrittene Theorie.", bn: "সে মৌলিক বিষয়গুলোই বোঝে না, উন্নত তত্ত্ব তো দূরের কথা।" },
              { de: "Sie kann kaum laufen, geschweige denn am Marathon teilnehmen.", bn: "সে তো ঠিকমতো হাঁটতেই পারে না, ম্যারাথনে অংশ নেওয়া তো দূরের কথা।" }
            ]
          },
          {
            german: "inwiefern / inwieweit",
            bengali: "কতটা / কোন দিক থেকে",
            english: "to what extent / in what way",
            type: "Indirekter Fragesatz (NS) – Verb am Ende",
            level: "C2",
            grammar: "Nebensatz (Verb am Ende). Asks or states the degree or extent of something.",
            examples: [
              { de: "Ich weiß nicht, inwiefern das wahr ist.", bn: "আমি জানি না, এটি কতটা সত্য।" },
              { de: "Er fragt mich, inwieweit ich ihm helfen kann.", bn: "সে আমাকে জিজ্ঞেস করছে, আমি তাকে কতখানি সাহায্য করতে পারি।" },
              { de: "Es ist unklar, inwiefern der Plan funktionieren kann.", bn: "এটি অস্পষ্ট যে পরিকল্পনাটি কতখানি কাজ করতে পারে।" },
              { de: "Sie möchte wissen, inwieweit du Deutsch verstehst.", bn: "সে জানতে চায়, তুমি কতটা জার্মান বোঝো।" },
              { de: "Wir müssen prüfen, inwiefern das Auto repariert ist.", bn: "আমাদের পরীক্ষা করতে হবে, গাড়িটি কতখানি মেরামত করা হয়েছে।" },
              { de: "Ich kann nicht sagen, inwieweit das Wetter morgen gut bleibt.", bn: "আমি বলতে পারছি না, আগামীকাল আবহাওয়া কতখানি ভালো থাকবে।" },
              { de: "Er erklärt mir, inwiefern dieser Kurs wichtig ist.", bn: "সে আমাকে ব্যাখ্যা করছে, এই কোর্সটি কোন দিক থেকে গুরুত্বপূর্ণ।" }
            ]
          }
        ];

        function App() {
          const [vocabulary, setVocabulary] = useState(defaultVocabulary);
          const [selectedLevel, setSelectedLevel] = useState('All');
          const [searchQuery, setSearchQuery] = useState('');
          const [isDarkMode, setIsDarkMode] = useState(false);
          const [expandedConnector, setExpandedConnector] = useState(null);

          useEffect(() => {
            if (isDarkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          const filteredVocabulary = vocabulary.filter(item => {
            const matchesLevel = selectedLevel === 'All' || item.level === selectedLevel;
            const matchesSearch = item.german.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  item.bengali.includes(searchQuery) ||
                                  item.english.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesLevel && matchesSearch;
          });

          const levels = ['All', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2'];

          const playAudio = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'de-DE';
              utterance.rate = 0.9;
              window.speechSynthesis.speak(utterance);
            }
          };

          const theme = {
            bg: isDarkMode ? "bg-slate-950" : "bg-slate-50",
            cardBg: isDarkMode ? "bg-slate-900" : "bg-white",
            text: isDarkMode ? "text-slate-100" : "text-slate-900",
            secondaryText: isDarkMode ? "text-slate-400" : "text-slate-600",
            border: isDarkMode ? "border-slate-800" : "border-slate-200",
          };

          return (
            <div className={`min-h-screen ${theme.bg} ${theme.text} font-sans transition-colors duration-300 pb-16`}>
              
              <header className={`sticky top-0 z-20 backdrop-blur-md ${isDarkMode ? 'bg-slate-900/90 border-b border-slate-800' : 'bg-white/90 border-b border-slate-200'} shadow-sm`}>
                <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center space-x-3">
                    <div className="w-11 h-11 bg-gradient-to-br from-sky-500 to-emerald-500 text-white rounded-2xl flex items-center justify-center font-extrabold text-lg shadow-lg shadow-sky-500/25">
                      D
                    </div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight">Deutsch mit Shakil</h1>
                      <p className="text-xs text-sky-600 dark:text-sky-400 font-semibold">All Connectors in German</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center space-x-3 w-full sm:w-auto justify-end">
                    <div className="relative flex-1 sm:w-72">
                      <input 
                        type="text" 
                        placeholder="Search connector (e.g. weil, obwohl)..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className={`w-full ${isDarkMode ? 'bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700' : 'bg-slate-100 text-slate-900 placeholder-slate-400 border-slate-200'} border px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 transition`}
                      />
                    </div>
                    <button 
                      onClick={() => setIsDarkMode(!isDarkMode)} 
                      className={`p-2.5 rounded-xl ${isDarkMode ? 'bg-slate-800 text-amber-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'} transition shadow-sm`}
                      title="Toggle Dark Mode"
                    >
                      {isDarkMode ? '☀️' : '🌙'}
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-5xl mx-auto px-4 pt-8">
                
                {/* Level Filters */}
                <div className="flex flex-wrap items-center justify-center gap-2 mb-8">
                  {levels.map(level => (
                    <button
                      key={level}
                      onClick={() => setSelectedLevel(level)}
                      className={`px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm ${
                        selectedLevel === level
                          ? 'bg-sky-600 text-white shadow-sky-500/30 shadow-md scale-105'
                          : `${isDarkMode ? 'bg-slate-900 text-slate-300 hover:bg-slate-800' : 'bg-white text-slate-700 hover:bg-slate-100'} border ${theme.border}`
                      }`}
                    >
                      {level === 'All' ? 'All Levels' : `Level ${level}`}
                    </button>
                  ))}
                </div>

                {/* Counter */}
                <div className="flex justify-between items-center mb-6 px-2">
                  <p className={`text-sm font-medium ${theme.secondaryText}`}>
                    Showing <span className="font-bold text-sky-600 dark:text-sky-400">{filteredVocabulary.length}</span> connector entries with full examples
                  </p>
                </div>

                <div className="space-y-5">
                  {filteredVocabulary.length === 0 ? (
                    <div className={`text-center py-20 rounded-3xl ${theme.cardBg} border ${theme.border} shadow-sm`}>
                      <p className={`text-base font-medium ${theme.secondaryText}`}>No connectors found matching your query.</p>
                    </div>
                  ) : (
                    filteredVocabulary.map((item, index) => {
                      const isExpanded = expandedConnector === item.german;
                      return (
                        <div 
                          key={index} 
                          className={`${theme.cardBg} rounded-3xl shadow-sm border ${theme.border} overflow-hidden transition duration-300 animate-fade-in hover:shadow-md`}
                        >
                          <div className="p-5 sm:p-7 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div className="flex items-start sm:items-center space-x-4">
                              <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-sm shrink-0 level-badge-${item.level}`}>
                                {item.level}
                              </div>
                              <div>
                                <div className="flex items-center space-x-3 flex-wrap gap-y-1">
                                  <h2 className={`text-2xl sm:text-3xl font-extrabold ${theme.text}`}>{item.german}</h2>
                                  <button 
                                    onClick={() => playAudio(item.german)}
                                    className="p-1.5 bg-sky-50 dark:bg-sky-950/40 hover:bg-sky-100 dark:hover:bg-sky-900/50 text-sky-600 dark:text-sky-400 rounded-full transition"
                                    title="Pronounce"
                                  >
                                    🔊
                                  </button>
                                </div>
                                <p className="text-sky-600 dark:text-sky-400 font-bold text-base sm:text-lg mt-0.5">
                                  {item.bengali} <span className="text-xs font-normal text-slate-400 italic">({item.english})</span>
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-end">
                              <span className="text-xs font-semibold px-3 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 max-w-[180px] truncate" title={item.type}>
                                {item.type}
                              </span>
                              <button 
                                onClick={() => setExpandedConnector(isExpanded ? null : item.german)}
                                className="bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-sm shadow-sky-500/20 transition whitespace-nowrap"
                              >
                                {isExpanded ? 'Hide' : `Examples (${item.examples.length})`}
                              </button>
                            </div>
                          </div>

                          {/* Grammar Rule Box */}
                          <div className={`px-5 sm:px-7 py-3 ${isDarkMode ? 'bg-slate-800/60 border-t border-slate-800' : 'bg-sky-50/70 border-t border-sky-100'} text-xs font-medium ${theme.secondaryText} flex items-start sm:items-center space-x-2`}>
                            <span className="text-sky-600 dark:text-sky-400 font-bold uppercase tracking-wider shrink-0">Rule:</span>
                            <span>{item.grammar}</span>
                          </div>

                          {isExpanded && (
                            <div className="p-5 sm:p-7 space-y-3 bg-slate-50/60 dark:bg-slate-950/40 border-t border-slate-100 dark:border-slate-800 animate-fade-in">
                              <h3 className="text-xs font-bold uppercase tracking-wider text-sky-600 dark:text-sky-400 mb-3">
                                Example Sentences ({item.examples.length})
                              </h3>

                              <div className="grid grid-cols-1 gap-3">
                                {item.examples.map((ex, exIdx) => (
                                  <div 
                                    key={exIdx} 
                                    className={`p-4 rounded-2xl ${theme.cardBg} border ${theme.border} shadow-xs hover:border-sky-300 dark:hover:border-sky-700 transition`}
                                  >
                                    <div className="flex justify-between items-start gap-2 mb-1.5">
                                      <p className={`text-base font-semibold ${theme.text} leading-snug`}>
                                        <span className="text-sky-500 mr-2 font-mono text-xs">#{exIdx + 1}</span>
                                        {ex.de}
                                      </p>
                                      <button 
                                        onClick={() => playAudio(ex.de)}
                                        className="text-slate-400 hover:text-sky-600 p-1 rounded transition text-sm shrink-0"
                                        title="Listen"
                                      >
                                        🔊
                                      </button>
                                    </div>
                                    <p className="text-sm font-semibold text-emerald-600 dark:text-emerald-400 pl-6 leading-snug">
                                      🇧🇩 {ex.bn}
                                    </p>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}

                        </div>
                      );
                    })
                  )}
                </div>

              </main>

              <footer className={`mt-16 py-6 text-center text-xs ${theme.secondaryText}`}>
                Deutsch mit Shakil · German Connectors Learning App ·
              </footer>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
